backend:
  name: git-gateway
  branch: main

media_folder: "slike"
public_folder: "/slike"

collections:
  # 1. UTKMICE, RASPORED I IZVJEŠTAJI
  - name: "utakmice"
    label: "Utakmice i Raspored"
    folder: "sadrzaj/utakmice"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: "Protivnik"
        name: "opponent"
        widget: "relation"
        collection: "klubovi"
        search_fields: ["title"]
        value_field: "title"
        display_fields: ["title"]
      - { label: "Datum i vrijeme", name: "date", widget: "datetime" }
      - { label: "Domaćin ili Gost", name: "venue", widget: "select", options: ["Domaćin", "Gost"] }
      - { label: "Kolo", name: "round", widget: "number", default: 1 }

      # SASTAV IGRAČA (Dostupno ODMAH, i za utakmice koje nisu odigrane)
      - label: "Sastav igrača za utakmicu"
        name: "player_stats"
        widget: "list"
        required: false
        fields:
          - label: "Izaberi igrača"
            name: "player"
            widget: "relation"
            collection: "igraci"
            search_fields: ["title"]
            value_field: "title"
            display_fields: ["title"]
          - { label: "Minuti na terenu", name: "minutes", widget: "number", default: 0 }
          - { label: "Golovi", name: "goals", widget: "number", default: 0 }
          - { label: "Asistencije", name: "assists", widget: "number", default: 0 }
          - { label: "Žuti kartoni", name: "yellow_cards", widget: "number", default: 0 }
          - { label: "Crveni karton", name: "red_card", widget: "boolean", default: false }
      
      # Polja za odigranu utakmicu (Popunjava se NAKON meča)
      - { label: "Odigrana utakmica?", name: "is_played", widget: "boolean", default: false }
      - { label: "Rezultat (npr. 2:1)", name: "score", widget: "string", required: false }
      - { label: "Tekst izvještaja sa utakmice", name: "report_text", widget: "markdown", required: false }

  # 2. KLUBOVI U LIGI
  - name: "klubovi"
    label: "Klubovi u ligi"
    folder: "sadrzaj/klubovi"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    fields:
      - { label: "Naziv kluba", name: "title", widget: "string" }
      - { label: "Grb kluba", name: "logo", widget: "image", required: false }

  # 3. TABELA LIGE
  - name: "tabela"
    label: "Tabela Lige"
    folder: "sadrzaj/tabela"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    fields:
      - label: "Naziv kluba"
        name: "title"
        widget: "relation"
        collection: "klubovi"
        search_fields: ["title"]
        value_field: "title"
        display_fields: ["title"]
      - { label: "Odigrano utakmica", name: "played", widget: "number", default: 0 }
      - { label: "Pobjede", name: "won", widget: "number", default: 0 }
      - { label: "Neriješene", name: "drawn", widget: "number", default: 0 }
      - { label: "Porazi", name: "lost", widget: "number", default: 0 }
      - { label: "Dati golovi", name: "goals_for", widget: "number", default: 0 }
      - { label: "Primljeni golovi", name: "goals_against", widget: "number", default: 0 }
      - { label: "Bodovi", name: "points", widget: "number", default: 0 }

  # 4. VIJESTI
  - name: "vijesti"
    label: "Vijesti"
    folder: "sadrzaj/vijesti"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Naslov", name: "title", widget: "string" }
      - { label: "Datum objave", name: "date", widget: "datetime" }
      - { label: "Slika vijesti", name: "image", widget: "image", required: false }
      - { label: "Kratak opis (za početnu stranu)", name: "summary", widget: "text" }
      - { label: "Glavni sadržaj / Tekst", name: "body", widget: "markdown" }

  # 5. IGRAČI (ROSTER I POČETNA/KORIGOVANA STATISTIKA)
  - name: "igraci"
    label: "Igrači"
    folder: "sadrzaj/igraci"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    fields:
      - { label: "Ime i prezime", name: "title", widget: "string" }
      - { label: "Broj dresa", name: "number", widget: "number" }
      - { label: "Pozicija", name: "position", widget: "select", options: ["Golman", "Odbrana", "Vezni", "Napad"] }
      - { label: "Datum rođenja", name: "birth_date", widget: "date", format: "YYYY-MM-DD", required: false }
      - { label: "U klubu od (godina)", name: "in_club_since", widget: "string", default: "2024" }
      - { label: "Fotografija igrača", name: "photo", widget: "image", required: false }
      - { label: "Početni/Korigovani nastupi", name: "base_appearances", widget: "number", default: 0 }
      - { label: "Početni/Korigovani minuti", name: "base_minutes", widget: "number", default: 0 }
      - { label: "Početni/Korigovani golovi", name: "base_goals", widget: "number", default: 0 }
      - { label: "Početne/Korigovane asistencije", name: "base_assists", widget: "number", default: 0 }
      - { label: "Početni žuti kartoni", name: "base_yellow_cards", widget: "number", default: 0 }
      - { label: "Početni crveni kartoni", name: "base_red_cards", widget: "number", default: 0 }