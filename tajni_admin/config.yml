backend:
  name: git-gateway
  branch: main

media_folder: "slike"
public_folder: "/slike"

collections:
  # 1. RASPORED UTAKMICA (Samo najava meča: kolo, protivnik, datum, domaćin/gost)
  - name: "utakmice"
    label: "Raspored utakmica"
    folder: "sadrzaj/utakmice"
    create: true
    format: "json"
    identifier_field: "round"
    slug: "kolo-{{round}}"
    sortable_fields: ["round"]
    view_default_sort:
      field: "round"
      direction: "ascending"
    fields:
      - { label: "Kolo", name: "round", widget: "number", default: 1 }
      - label: "Protivnik"
        name: "opponent"
        widget: "relation"
        collection: "klubovi"
        search_fields: ["title"]
        value_field: "title"
        display_fields: ["title"]
      - { label: "Datum i vrijeme", name: "date", widget: "string" }
      - { label: "Domaćin ili Gost", name: "venue", widget: "select", options: ["Domaćin", "Gost"] }
# 2. REZULTATI I IZVJEŠTAJI (Popunjava se NAKON meča)
  - name: "rezultati"
    label: "Rezultati i Izvještaji"
    folder: "sadrzaj/rezultati"
    create: true
    format: "json"
    identifier_field: "match_round"
    slug: "kolo-{{match_round}}"
    fields:
      - label: "Broj kola"
        name: "match_round"
        widget: "relation"
        collection: "utakmice"
        search_fields: ["round", "opponent"]
        value_field: "round"
        display_fields: ["round", "opponent"]
      - { label: "Rezultat (npr. 2:1)", name: "score", widget: "string" },
      - { label: "Tekst izvještaja sa utakmice", name: "report_text", widget: "markdown", required: false },
      
      # Startna postava
      - label: "Startna postava"
        name: "starting_lineup"
        widget: "list"
        required: false
        fields:
          - label: "Izaberi igrača"
            name: "player"
            widget: "relation"
            collection: "igraci"
            search_fields: ["title"]
            value_field: "title"
            display_fields: ["title"]
          - { label: "Minuti na terenu", name: "minutes", widget: "number", default: 90 },
          - { label: "Golovi", name: "goals", widget: "number", default: 0 },
          - { label: "Asistencije", name: "assists", widget: "number", default: 0 },
          - { label: "Žuti kartoni", name: "yellow_cards", widget: "number", default: 0 },
          - { label: "Crveni karton", name: "red_card", widget: "boolean", default: false }

      # Igrači na klupi i izmjene
      - label: "Igrači na klupi"
        name: "substitutes"
        widget: "list"
        required: false
        fields:
          - label: "Izaberi igrača (koji ulazi)"
            name: "player"
            widget: "relation"
            collection: "igraci"
            search_fields: ["title"]
            value_field: "title"
            display_fields: ["title"]
          - label: "Zamijenio igrača (koji je izašao)"
            name: "subbed_for"
            widget: "relation"
            collection: "igraci"
            search_fields: ["title"]
            value_field: "title"
            display_fields: ["title"],
            required: false
          - { label: "Minut ulaska u igru", name: "minute_in", widget: "number", required: false, default: 0 },
          - { label: "Golovi", name: "goals", widget: "number", default: 0 },
          - { label: "Asistencije", name: "assists", widget: "number", default: 0 },
          - { label: "Žuti kartoni", name: "yellow_cards", widget: "number", default: 0 },
          - { label: "Crveni karton", name: "red_card", widget: "boolean", default: false }
  # 3. KLUBOVI U LIGI
  - name: "klubovi"
    label: "Klubovi u ligi"
    folder: "sadrzaj/klubovi"
    create: true
    format: "json"
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}}"
    fields:
      - { label: "Naziv kluba", name: "title", widget: "string" }
      - { label: "Grb kluba", name: "logo", widget: "image", required: false }

  # 4. TABELA LIGE
  - name: "tabela"
    label: "Tabela Lige"
    folder: "sadrzaj/tabela"
    create: true
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}"
    identifier_field: "title"
    fields:
      - label: "Naziv kluba"
        name: "title"
        widget: "relation"
        collection: "klubovi"
        search_fields: ["title"]
        value_field: "title"
        display_fields: ["title"]
      - { label: "Odigrano utakmica", name: "played", widget: "number", default: 0 }
      - { label: "Pobjede", name: "won", widget: "number", default: 0 }
      - { label: "Neriješene", name: "drawn", widget: "number", default: 0 }
      - { label: "Porazi", name: "lost", widget: "number", default: 0 }
      - { label: "Dati golovi", name: "goals_for", widget: "number", default: 0 }
      - { label: "Primljeni golovi", name: "goals_against", widget: "number", default: 0 }
      - { label: "Bodovi", name: "points", widget: "number", default: 0 }

  # 5. VIJESTI
  - name: "vijesti"
    label: "Vijesti"
    folder: "sadrzaj/vijesti"
    create: true
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Naslov", name: "title", widget: "string" }
      - { label: "Datum objave", name: "date", widget: "datetime" }
      - { label: "Slika vijesti", name: "image", widget: "image", required: false }
      - { label: "Kratak opis (za početnu stranu)", name: "summary", widget: "text" }
      - { label: "Glavni sadržaj / Tekst", name: "body", widget: "markdown" }

  # 6. IGRAČI
  - name: "igraci"
    label: "Igrači"
    folder: "sadrzaj/igraci"
    create: true
    format: "json"
    slug: "{{slug}}"
    identifier_field: "title"
    fields:
      - { label: "Ime i prezime", name: "title", widget: "string" }
      - { label: "Broj dresa", name: "number", widget: "number" }
      - { label: "Pozicija", name: "position", widget: "select", options: ["Golman", "Odbrana", "Vezni", "Napad"] }
      - { label: "Datum rođenja", name: "birth_date", widget: "string", required: false }
      - { label: "U klubu od (godina)", name: "in_club_since", widget: "string", default: "8.9.2023." }
      - { label: "Fotografija igrača", name: "photo", widget: "image", required: false }
      - { label: "Početni/Korigovani nastupi", name: "base_appearances", widget: "number", default: 0 }
      - { label: "Početni/Korigovani minuti", name: "base_minutes", widget: "number", default: 0 }
      - { label: "Početni/Korigovani golovi", name: "base_goals", widget: "number", default: 0 }
      - { label: "Početne/Korigovane asistencije", name: "base_assists", widget: "number", default: 0 }
      - { label: "Početni žuti kartoni", name: "base_yellow_cards", widget: "number", default: 0 }
      - { label: "Početni crveni kartoni", name: "base_red_cards", widget: "number", default: 0 }